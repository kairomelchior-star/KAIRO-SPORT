name: Kairo Sport - actualités automatiques

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Africa/Bangui"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer le traducteur
        run: pip install --disable-pip-version-check deep-translator

      - name: Mettre à jour les actualités
        run: python scripts/update_news.py

      - name: Publier uniquement s'il y a un changement
        run: |
          git config user.name "kairo-sport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle actualité."
          else
            git commit -m "Actualités automatiques Kairo Sport"
            git push
          fi
